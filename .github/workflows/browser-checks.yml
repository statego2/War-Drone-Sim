name: Browser prototype checks
on:
  push:
    paths: ["index.html", "src/**", "tests/**", "package.json", ".github/workflows/browser-checks.yml"]
  pull_request:
    paths: ["index.html", "src/**", "tests/**", "package.json", ".github/workflows/browser-checks.yml"]
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/game.mjs
      - run: node --check src/game3d.mjs
      - run: node --check src/flight3d.mjs

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-sky-chromium-preview
          path: artifacts/open-sky-webgl.png
          if-no-files-found: ignore
